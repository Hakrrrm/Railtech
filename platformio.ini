; PlatformIO project config -- LRV mileage tracking firmware.
; Build Plan Sec 3 / Sec 10 (cross-cutting configuration checklist).

; src_dir is a project-level option only -- PlatformIO silently ignores
; it (with an easy-to-miss warning) if placed inside an [env:...]
; section, which is exactly what happened on the first attempt at this
; fix: the warning "Ignore unknown configuration option 'src_dir' in
; section [env:stage3-wifi-hotspot]" was the real story, and the build
; kept falling back to the default (nonexistent) top-level src/.
;
; Because src_dir can only be set once for the whole project, every
; harness target lives under one shared parent (firmware/harness/) with
; one subfolder per stage; build_src_filter (which IS an env-level
; option, unlike src_dir -- already proven by stage3-wifi-hotspot's own
; entry below) selects the one subfolder each env should actually
; compile, so two harnesses' setup()/loop() never collide in the same
; build.
[platformio]
src_dir = firmware/harness

[env:stage3-wifi-hotspot]
; Board config verified against LilyGo's own LilyGo-Modem-Series
; platformio.ini (the [env:T-SIM7670G-S3-Standard] entry -- their default
; env, board=esp32-s3-wroom-1-n16r2), replacing the earlier unverified
; esp32-s3-devkitc-1 placeholder. The custom board definition itself
; lives at ../boards/esp32-s3-wroom-1-n16r2.json (PlatformIO doesn't ship
; this board id built in -- it's LilyGo's own, auto-discovered from the
; project-local boards/ directory).
platform = espressif32@6.12.0
board = esp32-s3-wroom-1-n16r2
; PSRAM RESOLVED (was flagged unresolved): 2 MB, confirmed three ways --
; the board id itself (N16R2), a schematic trace of the shared Standard-
; series PCB, and now boards/esp32-s3-wroom-1-n16r2.json's own name field
; ("16M Flash 2M QSPI PSRAM"), sourced directly from a working LilyGo
; project. This contradicts TDD Sec 5.1's stated 8 MB PSRAM -- that's a
; TDD correction to make, not a remaining firmware question.
framework = arduino
monitor_speed = 115200
build_src_filter = +<stage3/*>
; Referencing firmware/src/*.c directly from build_src_filter (the
; previous approach) collided with PlatformIO's internal build-directory
; mapping on real hardware: "'.../build/stage3-wifi-hotspot/src' already
; has a source directory: '.../firmware/src'". lib_extra_dirs is the
; standard PlatformIO mechanism for shared code living outside src_dir --
; it's auto-discovered and linked via the #include chain in
; main_hotspot_test.cpp (event_serializer.h, seq_store.h), no manual
; external path references needed.
lib_extra_dirs = firmware
build_flags =
    -DLILYGO_SIMCOM_STANDARD_PIN
    -DLILYGO_SIM7670G_S3_STAN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra
lib_deps =
    knolleary/PubSubClient@^2.8

[env:stage5-gnss-matcher]
; Real GNSS (direct AT+CGNSSINFO, 1 Hz) + map matcher + optional IMU
; stationary gate. Serial + SD only -- no Wi-Fi/MQTT in this harness,
; deferred per explicit user instruction until a SIM card is available
; to test cellular + MQTT together (Stage 7).
;
; No TinyGSM: explicit user request, and also a real necessity -- the
; publicly published vshymanskyy/TinyGSM package has no SIM7670G modem
; definition at all (confirmed by inspecting its source directly), so
; `#define TINY_GSM_MODEM_SIM7670G` only ever compiled against LilyGo's
; own vendored fork, never this registry package. Modem/GNSS bring-up
; is direct AT commands over SerialAT instead -- see
; main_gnss_matcher.cpp's gnss_bringup().
platform = espressif32@6.12.0
board = esp32-s3-wroom-1-n16r2
framework = arduino
monitor_speed = 115200
build_src_filter = +<stage5/*>
lib_extra_dirs = firmware
build_flags =
    -DLILYGO_SIMCOM_STANDARD_PIN
    -DLILYGO_SIM7670G_S3_STAN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra

[env:cellular-mqtt-test]
; Standalone cellular MQTT bring-up test -- proves the SIM card
; registers on LTE and the modem's onboard MQTT client (AT+CMQTT...)
; can publish, independent of GNSS/matcher/SD (Stage 5) and independent
; of Wi-Fi (Stage 3). No TinyGSM, same reason as stage5-gnss-matcher --
; see main_cellular_mqtt_test.cpp's header comment.
platform = espressif32@6.12.0
board = esp32-s3-wroom-1-n16r2
framework = arduino
monitor_speed = 115200
build_src_filter = +<cellular-mqtt-test/*>
lib_extra_dirs = firmware
build_flags =
    -DLILYGO_SIMCOM_STANDARD_PIN
    -DLILYGO_SIM7670G_S3_STAN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra
