; PlatformIO project config -- LRV mileage tracking firmware.
; Build Plan Sec 3 / Sec 10 (cross-cutting configuration checklist).

[env:stage3-wifi-hotspot]
; Board config verified against LilyGo's own LilyGo-Modem-Series
; platformio.ini (the [env:T-SIM7670G-S3-Standard] entry -- their default
; env, board=esp32-s3-wroom-1-n16r2), replacing the earlier unverified
; esp32-s3-devkitc-1 placeholder.
platform = espressif32@6.12.0
board = esp32-s3-wroom-1-n16r2
; NOTE (unresolved): the naming convention for this board id (N16R2)
; implies 16 MB flash / 2 MB PSRAM, but TDD Sec 5.1's hardware table
; states 8 MB PSRAM for the T-SIM7670G-S3. LilyGo's repo has two distinct
; variants -- [env:T-SIM7670G] (board=esp32s3box) and this "Standard"
; series one -- with the Standard series described as "different from
; others ... the only difference is the modem." If your board doesn't
; match this PSRAM size, check the silkscreen against LilyGo's variant
; docs and confirm which env is actually correct before flashing.
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<../firmware/src/event_serializer.c>
    +<../firmware/src/seq_store.c>
    +<../firmware/harness_stage3/main_hotspot_test.cpp>
build_flags =
    -DLILYGO_SIMCOM_STANDARD_PIN
    -DLILYGO_SIM7670G_S3_STAN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra
lib_deps =
    knolleary/PubSubClient@^2.8
