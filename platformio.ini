; PlatformIO project config -- LRV mileage tracking firmware.
; Build Plan Sec 3 / Sec 10 (cross-cutting configuration checklist).

[env:stage3-wifi-hotspot]
platform = espressif32
board = esp32-s3-devkitc-1
; NOTE: this is a stand-in board definition for the ESP32-S3 core on the
; LILYGO T-SIM7670G-S3. If the team already has a board def used elsewhere
; for this exact board (flash/PSRAM size, partition table), swap it in here
; -- Build Plan Sec 10 says to keep whatever's already used for this
; LILYGO, and none exists yet in this repo. Flagged as an assumption in
; the PR, not verified against real hardware.
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<../firmware/src/event_serializer.c>
    +<../firmware/src/seq_store.c>
    +<../firmware/harness_stage3/main_hotspot_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra
lib_deps =
    knolleary/PubSubClient@^2.8
